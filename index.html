<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NTA Style Result - Prerana Institute</title><style>
body { margin:0; font-family: Arial; background:#f0f2f5; }
.header { background:#002147; color:white; padding:15px; text-align:center; font-size:22px; }
.container { max-width:700px; margin:30px auto; background:white; padding:25px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2);} 
input { width:100%; padding:10px; margin:10px 0; border:1px solid #ccc; border-radius:5px; }
button { width:100%; padding:12px; background:#002147; color:white; border:none; font-size:16px; cursor:pointer; }
button:hover { background:#003b7a; }
table { width:100%; border-collapse: collapse; margin-top:20px; }
table, th, td { border:1px solid #ddd; }
th, td { padding:10px; }
th { background:#002147; color:white; }
.result-box { display:none; }
.cutoff { margin-top:20px; background:#e8f0fe; padding:15px; border-radius:8px; }
</style></head><body><div class="header">Prerana Institute Entrance Examination Result</div><div class="container" id="formBox">
    <input type="text" id="roll" placeholder="Roll Number">
    <input type="date" id="dob">
    <button onclick="showResult()">Submit</button>
</div><div class="container result-box" id="resultBox">
    <h3>Score Card</h3><table>
    <tr><th>Name</th><td id="name"></td></tr>
    <tr><th>Roll Number</th><td id="rRoll"></td></tr>
    <tr><th>Date of Birth</th><td id="rDob"></td></tr>
    <tr><th>Application No</th><td id="app"></td></tr>
</table>

<h3>Marks Details</h3>
<table>
    <tr><th>Subject</th><th>Marks</th></tr>
    <tr><td>Physics</td><td id="phy"></td></tr>
    <tr><td>Chemistry</td><td id="chem"></td></tr>
    <tr><td>Mathematics</td><td id="math"></td></tr>
</table>

<h3>Overall</h3>
<table>
    <tr><th>Total</th><td id="total"></td></tr>
    <tr><th>Percentile</th><td id="percentile"></td></tr>
    <tr><th>Rank</th><td id="rank"></td></tr>
</table>

<div class="cutoff">
    <b>Cutoff (Expected)</b><br>
    General: 90 | OBC: 75 | SC: 55 | ST: 45 | EWS: 85<br>
    <b>Status:</b> <span id="status"></span>
</div>

<button onclick="window.print()">Download</button>

</div><script>
// Fake database
const students = {
    "101": {name:"Rahul", dob:"2006-05-10", phy:70, chem:65, math:80},
    "102": {name:"Aman", dob:"2005-11-21", phy:50, chem:60, math:55},
    "103": {name:"Sneha", dob:"2006-01-02", phy:90, chem:88, math:95}
};

function showResult(){
    let roll = document.getElementById("roll").value;
    let dob = document.getElementById("dob").value;

    if(!students[roll]){
        alert("Invalid Roll Number");
        return;
    }

    let s = students[roll];

    if(s.dob !== dob){
        alert("DOB mismatch");
        return;
    }

    let total = s.phy + s.chem + s.math;
    let percentile = (total/300*100).toFixed(2);
    let rank = Math.floor((300-total)*100);

    document.getElementById("name").innerText = s.name;
    document.getElementById("rRoll").innerText = roll;
    document.getElementById("rDob").innerText = dob;
    document.getElementById("app").innerText = "PR2026"+roll;

    document.getElementById("phy").innerText = s.phy;
    document.getElementById("chem").innerText = s.chem;
    document.getElementById("math").innerText = s.math;

    document.getElementById("total").innerText = total;
    document.getElementById("percentile").innerText = percentile;
    document.getElementById("rank").innerText = rank;

    document.getElementById("status").innerText = percentile>=90?"Qualified":"Not Qualified";

    document.getElementById("formBox").style.display="none";
    document.getElementById("resultBox").style.display="block";
}
</script></body>
</html>
