<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wish</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

/* BLUE PREMIUM BACKGROUND */
.screen {
    height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: radial-gradient(circle at center, #1e5eff, #0b1f5e);
    position: absolute;
}

/* GOLD TEXT */
.gold-text {
    color: #d4af37;
    font-size: 32px;
    letter-spacing: 2px;
    text-align: center;
}

/* TYPEWRITER EFFECT */
.cursor {
    display: inline-block;
    width: 2px;
    background: #d4af37;
    animation: blink 1s infinite;
    margin-left: 5px;
}

@keyframes blink {
    0%, 50%, 100% {opacity:1;}
    25%, 75% {opacity:0;}
}

/* PASSWORD BOX */
.password-box {
    margin-top: 40px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    padding: 20px 25px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    text-align: center;
}

.password-box p {
    color: #fff;
    margin-bottom: 10px;
}

.password-box input {
    padding: 10px;
    border: none;
    border-radius: 8px;
    outline: none;
    text-align: center;
}

.password-box button {
    margin-top: 10px;
    padding: 8px 20px;
    border: none;
    background: #d4af37;
    color: black;
    border-radius: 8px;
    cursor: pointer;
}

/* SECOND SCREEN */
#screen2 {
    display: none;
    color: #d4af37;
    text-align: center;
}

#screen2 h1 {
    font-size: 42px;
}

#screen2 p {
    color: white;
    max-width: 80%;
    font-size: 18px;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
    <div class="gold-text" id="typing"></div><span class="cursor"></span>

    <div class="password-box">
        <p>Enter Passkey To Continue</p>
        <input type="password" id="pass" placeholder="Passkey">
        <br>
        <button onclick="checkPass()">Unlock</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
    <h1>Happy Birthday Tanishi G 🎉</h1>
    <p>
        Aaj ka din ek special celebration hai — ek aisi personality ka  
        jo leadership, positivity aur grace ka perfect example hai.  
        Stay amazing, keep shining ✨
    </p>
</div>

<script>
const text = "Happy Birthday Madam President Tanishi Jii";
let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 60);
    }
}

typeWriter();

function checkPass() {
    let userPass = document.getElementById("pass").value;

    if(userPass === "MMTG231803") {
        document.getElementById("screen1").style.display = "none";
        document.getElementById("screen2").style.display = "flex";
    } else {
        alert("Wrong Passkey ❌");
    }
}
</script>

</body>
</html>
