<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:'Poppins';overflow:hidden}

/* SCREEN */
.screen{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}

/* INTRO */
#screen1{background:linear-gradient(135deg,#0b1f5e,#1e5eff);color:#d4af37}
#typing{font-size:38px;font-family:'Playfair Display';letter-spacing:3px}

/* PASSWORD */
.pass-box{margin-top:30px;background:rgba(255,255,255,0.15);padding:20px;border-radius:15px}
.pass-box input{padding:10px;border:none;border-radius:8px;text-align:center}
.pass-box button{margin-top:10px;padding:8px 20px;background:#d4af37;border:none;border-radius:8px;cursor:pointer}

/* PHOTO */
#photoScreen{display:none;background:black}
#photoScreen img{width:100%;height:100%;object-fit:cover}

/* MAIN */
#main{display:none;overflow:auto;background:linear-gradient(#1e5eff,#0b1f5e);color:white;padding:20px}
.title{font-family:'Playfair Display';font-size:34px}
.countdown{margin-top:10px;background:rgba(0,0,0,0.4);padding:10px;border-radius:10px}

/* BOX */
.box{margin-top:20px;padding:15px;border-radius:15px}
.box1{background:linear-gradient(135deg,#ff7eb3,#ff758c)}
.box2{background:linear-gradient(135deg,#43cea2,#185a9d)}

.btn{display:inline-block;margin-top:10px;padding:8px 15px;background:#fff;color:black;border-radius:8px;cursor:pointer}

/* CAKE */
.cake-box{margin-top:20px;padding:15px;border-radius:15px;background:#ffd1dc;color:black}
.cake{width:120px;height:120px;background:#ff69b4;margin:15px auto;border-radius:10px;display:none}
.knife{display:none;cursor:pointer}

/* TEXT RAIN */
.hb{position:fixed;color:white;font-size:20px;animation:fall 3s linear}
@keyframes fall{from{transform:translateY(-100px)}to{transform:translateY(100vh)}}

/* EMAIL */
.email{margin-top:20px}

/* MUSIC BUTTON */
.music-btn{position:fixed;top:10px;right:10px;background:white;padding:8px;border-radius:10px;cursor:pointer}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="music-btn" onclick="toggleMusic()">🎵</div>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
<div id="typing"></div>

<div class="pass-box">
<p style="color:white">Enter Password</p>
<input type="password" id="pass">
<br>
<button onclick="checkPass()">Continue</button>
</div>
</div>

<!-- PHOTO -->
<div class="screen" id="photoScreen">
<img src="photo.jpg">
</div>

<!-- MAIN -->
<div id="main">

<div class="title">Happy Birthday Tanishi G 👑</div>
<div class="countdown" id="countdown"></div>

<div class="box box1">
<h3>🎁 Special Birthday Wishes</h3>
<div class="btn" onclick="verify()">Access</div>
</div>

<div class="box box2">
<h3>🎥 Friends Video Messages</h3>
<a class="btn" href="https://fixed-dragonfly-5de.notion.site/Birthday-wishes-34989058459d80f4afb2dd1d771816f4?pvs=73" target="_blank">Open</a>
</div>

<!-- CAKE -->
<div class="cake-box">
<h3>🎂 Cake Cutting kijiye</h3>
<div class="btn" onclick="showCake()">Start</div>

<div class="cake" id="cake"></div>
<div class="knife" id="knife" onclick="cutCake()">🔪 Cut</div>
</div>

<!-- MESSAGE -->
<div style="margin-top:20px">
Feliz cumpleaños Tanishi 🎉 You are amazing 💫 Stay blessed Queen 👑✨
</div>

<!-- EMAIL -->
<div class="email">
<a href="mailto:mankitmankit7@gmail.com" style="color:#d4af37;">Send Feedback</a>
</div>

</div>

<script>

/* TYPE */
let text="HAPPY BIRTHDAY TANISHI";
let i=0;
function type(){
if(i<text.length){
document.getElementById("typing").innerHTML+=text.charAt(i);
i++;
setTimeout(type,50);
}}
type();

/* PASSWORD */
function checkPass(){
if(document.getElementById("pass").value==="MMTG231803"){

let music=document.getElementById("bgMusic");
music.play().catch(()=>{});

document.getElementById("screen1").style.display="none";
document.getElementById("photoScreen").style.display="flex";

setTimeout(()=>{
document.getElementById("photoScreen").style.display="none";
document.getElementById("main").style.display="block";
document.body.style.overflow="auto";
},3000);

}else alert("Wrong Password ❌");
}

/* MUSIC */
function toggleMusic(){
let m=document.getElementById("bgMusic");
m.paused?m.play():m.pause();
}

/* COUNTDOWN */
let target=new Date("April 23, 2026").getTime();
setInterval(()=>{
let now=new Date().getTime();
let gap=target-now;

if(gap<=0){
document.getElementById("countdown").innerHTML="🎉 Janamdin Mubarak 🎉";
return;
}

let d=Math.floor(gap/(1000*60*60*24));
let h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((gap%(1000*60*60))/(1000*60));
let s=Math.floor((gap%(1000*60))/1000);

document.getElementById("countdown").innerHTML=
d+"d "+h+"h "+m+"m "+s+"s";
},1000);

/* VERIFY */
function verify(){
let ans=prompt("5 + 3 ?");
if(ans=="8"){
window.open("https://drive.google.com/drive/folders/1min7ZnGdjJjx8g29qIIWgF4RecHZ365Q");
}else alert("Wrong ❌");
}

/* CAKE */
function showCake(){
document.getElementById("cake").style.display="block";
document.getElementById("knife").style.display="block";
}

function cutCake(){
for(let i=0;i<25;i++){
let span=document.createElement("div");
span.className="hb";
span.innerText="Happy Birthday 🎉";
span.style.left=Math.random()*100+"vw";
document.body.appendChild(span);
setTimeout(()=>span.remove(),3000);
}
}

</script>

</body>
</html>
