<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins';
background:black;
color:white;
overflow:hidden;
}

/* SCREEN */
.screen{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

/* INTRO */
#screen1{
background: radial-gradient(circle,#000,#0b1f5e);
}

#typing{
font-size:40px;
font-family:'Playfair Display';
color:#ffd700;
text-shadow:0 0 20px #ffd700;
}

/* PASSWORD */
.pass-box{
margin-top:30px;
background:rgba(255,255,255,0.1);
padding:20px;
border-radius:15px;
backdrop-filter:blur(10px);
}

.pass-box input{
padding:10px;
border:none;
border-radius:8px;
text-align:center;
}

.pass-box button{
margin-top:10px;
padding:8px 20px;
background:#ffd700;
border:none;
border-radius:8px;
cursor:pointer;
}

/* PHOTO */
#photoScreen{
display:none;
background:black;
}

#photoScreen img{
width:100%;
height:100%;
object-fit:cover;
}

/* MAIN */
#main{
display:none;
overflow:auto;
padding:20px;
background:linear-gradient(#000,#1e5eff);
}

/* TITLE */
.title{
font-size:34px;
font-family:'Playfair Display';
text-shadow:0 0 10px #fff;
}

/* COUNTDOWN */
.countdown{
margin-top:10px;
background:rgba(255,255,255,0.1);
padding:10px;
border-radius:10px;
}

/* BOX */
.box{
margin-top:20px;
padding:20px;
border-radius:15px;
background:rgba(255,255,255,0.1);
transition:0.3s;
}

.box:hover{
transform:scale(1.05);
background:rgba(255,255,255,0.2);
}

/* BUTTON */
.btn{
margin-top:10px;
display:inline-block;
padding:10px 15px;
background:#ffd700;
color:black;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

/* CAKE */
.cake-box{
margin-top:20px;
padding:20px;
border-radius:15px;
background:linear-gradient(#ff9a9e,#fad0c4);
color:black;
}

.cake{
width:120px;
height:120px;
background:#ff4da6;
margin:15px auto;
border-radius:10px;
display:none;
}

.knife{display:none;cursor:pointer}

/* TEXT RAIN */
.hb{
position:fixed;
color:#ffd700;
animation:fall 3s linear;
}
@keyframes fall{
from{transform:translateY(-100px)}
to{transform:translateY(100vh)}
}

/* MUSIC */
.music-btn{
position:fixed;
top:10px;
right:10px;
background:#ffd700;
padding:8px;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="music-btn" onclick="toggleMusic()">🎵</div>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
<div id="typing"></div>

<div class="pass-box">
<p>Enter Password</p>
<input type="password" id="pass">
<br>
<button onclick="checkPass()">Continue</button>
</div>
</div>

<!-- PHOTO -->
<div class="screen" id="photoScreen">
<img src="photo.jpg">
</div>

<!-- MAIN -->
<div id="main">

<div class="title">Happy Birthday Tanishi G 👑</div>
<div class="countdown" id="countdown"></div>

<!-- LINKS -->
<div class="box">
<h3>🎁 Birthday Wishes 1</h3>
<a class="btn" href="https://drive.google.com/drive/folders/1min7ZnGdjJjx8g29qIIWgF4RecHZ365Q" target="_blank">Open</a>
</div>

<div class="box">
<h3>🎁 Birthday Wishes 2</h3>
<a class="btn" href="https://drive.google.com/drive/folders/1min7ZnGdjJjx8g29qIIWgF4RecHZ365Q" target="_blank">Open</a>
</div>

<!-- CAKE -->
<div class="cake-box">
<h3>🎂 Cake Cutting</h3>
<div class="btn" onclick="showCake()">Start</div>

<div class="cake" id="cake"></div>
<div class="knife" id="knife" onclick="cutCake()">🔪 Cut</div>
</div>

<!-- EMAIL -->
<div style="margin-top:20px">
<a href="mailto:mankitmankit7@gmail.com" style="color:#ffd700;">Send Feedback</a>
</div>

</div>

<script>

/* TYPE */
let text="HAPPY BIRTHDAY TANISHI";
let i=0;
function type(){
if(i<text.length){
typing.innerHTML+=text.charAt(i);
i++;
setTimeout(type,50);
}}
type();

/* PASSWORD */
function checkPass(){
if(pass.value==="MMTG231803"){

bgMusic.play().catch(()=>{});

screen1.style.display="none";
photoScreen.style.display="flex";

setTimeout(()=>{
photoScreen.style.display="none";
main.style.display="block";
document.body.style.overflow="auto";
},3000);

}else alert("Wrong Password ❌");
}

/* MUSIC */
function toggleMusic(){
bgMusic.paused?bgMusic.play():bgMusic.pause();
}

/* COUNTDOWN */
let target=new Date("April 23, 2026").getTime();
setInterval(()=>{
let now=new Date().getTime();
let gap=target-now;

if(gap<=0){
countdown.innerHTML="🎉 Janamdin Mubarak 🎉";
return;
}

let d=Math.floor(gap/(1000*60*60*24));
let h=Math.floor((gap%(1000*60*60*24))/(1000*60*60));
let m=Math.floor((gap%(1000*60*60))/(1000*60));
let s=Math.floor((gap%(1000*60))/1000);

countdown.innerHTML=d+"d "+h+"h "+m+"m "+s+"s";
},1000);

/* CAKE */
function showCake(){
cake.style.display="block";
knife.style.display="block";
}

function cutCake(){
for(let i=0;i<30;i++){
let el=document.createElement("div");
el.className="hb";
el.innerText="Happy Birthday 🎉";
el.style.left=Math.random()*100+"vw";
document.body.appendChild(el);
setTimeout(()=>el.remove(),3000);
}
}

</script>

</body>
</html>
