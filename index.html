<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prerana Institute Entrance Exam Result</title><style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: rgba(255,255,255,0.05);
        padding: 40px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        width: 350px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    h1 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        border: none;
        border-radius: 10px;
        background: #00c6ff;
        color: black;
        font-size: 18px;
        cursor: pointer;
        font-weight: bold;
    }

    button:hover {
        background: #00a2d3;
    }

    .result-box {
        display: none;
        text-align: center;
    }

    .big {
        font-size: 26px;
        margin: 10px 0;
    }

    .highlight {
        font-size: 30px;
        color: #00ffcc;
        font-weight: bold;
    }
</style></head><body><div class="container" id="formBox">
    <h1>Prerana Institute Entrance Exam</h1><input type="text" id="roll" placeholder="Enter Roll Number">
<input type="date" id="examDate">
<input type="date" id="dob">

<button onclick="showResult()">See Result</button>

</div><div class="container result-box" id="resultBox">
    <h1>Result</h1><div class="big">Exam: Prerana Institute Entrance Exam</div>
<div class="big">Roll Number: <span id="rRoll"></span></div>

<div class="big">Percentile</div>
<div class="highlight" id="percentile"></div>

<div class="big">All India Rank</div>
<div class="highlight" id="rank"></div>

</div><script>
function showResult() {
    let roll = document.getElementById("roll").value;
    let examDate = document.getElementById("examDate").value;
    let dob = document.getElementById("dob").value;

    if(roll === "" || examDate === "" || dob === "") {
        alert("Please fill all details");
        return;
    }

    // Fake calculation
    let percentile = (Math.random() * 40 + 60).toFixed(2);
    let rank = Math.floor(Math.random() * 50000 + 1000);

    document.getElementById("rRoll").innerText = roll;
    document.getElementById("percentile").innerText = percentile + "%";
    document.getElementById("rank").innerText = rank;

    document.getElementById("formBox").style.display = "none";
    document.getElementById("resultBox").style.display = "block";
}
</script></body>
</html>
