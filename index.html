<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Thank You From Mankit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    color:#fff;
    font-family:"Montserrat",sans-serif;

    background:
        radial-gradient(circle at 50% 25%, #70500b 0%, #2c1e03 30%, #0c0903 68%, #030303 100%);
}

/* =========================
   GOLD PARTICLES
========================= */

#particles{
    position:fixed;
    inset:0;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.particle{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ffe6a0;

    box-shadow:
        0 0 6px #ffd34e,
        0 0 15px #ffb700;

    animation:floatParticle linear infinite;
}

@keyframes floatParticle{

    0%{
        transform:translateY(110vh) scale(.5);
        opacity:0;
    }

    15%{
        opacity:.8;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-10vh) scale(1.2);
        opacity:0;
    }

}

/* =========================
   MAIN
========================= */

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:50px 20px;
    position:relative;
    z-index:1;
}

.container{
    width:min(850px,100%);
    text-align:center;
}

/* =========================
   INTRO
========================= */

.intro{
    animation:fadeIntro 1.5s ease forwards;
}

.top-line{
    width:0;
    height:1px;
    margin:0 auto 30px;

    background:linear-gradient(
        90deg,
        transparent,
        #ffd45a,
        transparent
    );

    box-shadow:0 0 25px #ffd45a;

    animation:lineGrow 2s ease forwards;
}

.intro-small{
    font-size:11px;
    letter-spacing:7px;
    text-transform:uppercase;
    color:#e8c66a;

    opacity:0;

    animation:fadeUp 1s ease .5s forwards;
}

.mankit{
    margin-top:20px;

    font-family:"Great Vibes",cursive;

    font-size:clamp(85px,18vw,170px);

    line-height:1;

    color:#ffd45a;

    text-shadow:
        0 0 5px #fff7cf,
        0 0 15px #ffe17a,
        0 0 35px #ffc400,
        0 0 70px #d99300,
        0 0 120px rgba(255,190,30,.7);

    animation:goldGlow 2.5s infinite alternate;
}

.intro-bottom{
    margin-top:25px;

    font-family:"Cinzel",serif;

    font-size:12px;

    letter-spacing:5px;

    color:#fff1bd;

    opacity:0;

    animation:fadeUp 1s ease 1.3s forwards;
}

@keyframes goldGlow{

    from{
        text-shadow:
            0 0 5px #fff7cf,
            0 0 15px #ffe17a,
            0 0 35px #ffc400;
    }

    to{
        text-shadow:
            0 0 10px #fff,
            0 0 30px #ffe17a,
            0 0 60px #ffc400,
            0 0 110px rgba(255,190,30,.8);
    }

}

@keyframes lineGrow{
    to{
        width:300px;
    }
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes fadeIntro{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

/* =========================
   FORM
========================= */

.form-section{
    display:none;
}

.form-section.show{
    display:block;
    animation:sectionReveal 1.2s ease forwards;
}

@keyframes sectionReveal{

    from{
        opacity:0;
        transform:translateY(35px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

.label{
    color:#dcb957;
    font-size:11px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:12px;
}

.title{
    font-family:"Cinzel",serif;
    font-size:clamp(26px,6vw,44px);
    color:#fff1c2;
    margin-bottom:35px;
}

.form-box{
    width:min(580px,100%);
    margin:auto;

    padding:30px;

    border:1px solid rgba(255,210,90,.25);

    border-radius:25px;

    background:rgba(0,0,0,.25);

    box-shadow:
        inset 0 0 30px rgba(255,190,30,.04),
        0 0 40px rgba(255,190,30,.08);

    backdrop-filter:blur(8px);
}

.input-group{
    text-align:left;
    margin-bottom:22px;
}

.input-label{
    display:block;
    margin-bottom:9px;

    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;

    color:#d7bd77;
}

input,
select{

    width:100%;

    padding:17px 18px;

    border-radius:13px;

    border:1px solid rgba(255,210,90,.4);

    outline:none;

    background:rgba(0,0,0,.5);

    color:#fff1bd;

    font-family:"Montserrat",sans-serif;

    font-size:15px;

    transition:.3s;

}

select option{
    background:#171104;
    color:#fff;
}

input::placeholder{
    color:#95835a;
}

input:focus,
select:focus{

    border-color:#ffd45a;

    box-shadow:
        0 0 15px rgba(255,205,70,.25),
        inset 0 0 15px rgba(255,205,70,.06);

}

/* =========================
   BUTTON
========================= */

.generate-btn{

    width:100%;

    margin-top:5px;

    padding:17px;

    border-radius:50px;

    border:1px solid #e8bd46;

    cursor:pointer;

    font-family:"Cinzel",serif;

    letter-spacing:2px;

    color:#fff8df;

    background:
        linear-gradient(
            120deg,
            #74500b,
            #d8aa34,
            #ffe07a,
            #b47d13,
            #704b07
        );

    background-size:250% 100%;

    animation:goldButton 5s linear infinite;

    box-shadow:
        0 0 20px rgba(255,195,50,.2);

    transition:.3s;
}

.generate-btn:hover{

    transform:translateY(-2px);

    box-shadow:
        0 0 35px rgba(255,210,80,.5);

}

.generate-btn:active{
    transform:scale(.98);
}

@keyframes goldButton{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }

}

/* =========================
   MESSAGE
========================= */

.message-section{

    display:none;

    margin-top:50px;

}

.message-section.show{

    display:block;

    animation:messageAppear 1.3s ease forwards;

}

@keyframes messageAppear{

    from{
        opacity:0;
        transform:translateY(30px) scale(.97);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }

}

.decorative-line{

    width:180px;
    height:1px;

    margin:0 auto 30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e5b83f,
            transparent
        );

    box-shadow:0 0 15px #d9a82f;
}

.message-card{

    padding:45px 35px;

    border-top:1px solid rgba(255,211,91,.5);
    border-bottom:1px solid rgba(255,211,91,.5);

    background:
        radial-gradient(
            circle at center,
            rgba(255,190,30,.07),
            transparent 65%
        );
}

.to{

    font-family:"Great Vibes",cursive;

    font-size:45px;

    color:#ffd45a;

    text-shadow:
        0 0 15px rgba(255,205,70,.6);

    margin-bottom:8px;
}

.subject-display{

    font-size:10px;

    letter-spacing:4px;

    text-transform:uppercase;

    color:#cdb16b;

    margin-bottom:30px;
}

.message-text{

    font-family:"Cinzel",serif;

    font-size:15px;

    line-height:2;

    color:#f7eac5;

    text-align:center;

}

.message-text p{
    margin-bottom:20px;
}

.message-text p:last-child{
    margin-bottom:0;
}

.signature-area{

    margin-top:40px;

    padding-top:25px;

    border-top:1px solid rgba(255,210,90,.15);

}

.with{

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:3px;

    color:#bda66d;

}

.from{

    font-family:"Great Vibes",cursive;

    font-size:46px;

    color:#ffd45a;

    margin-top:5px;

    text-shadow:
        0 0 18px rgba(255,205,70,.55);
}

.credentials{

    margin-top:7px;

    color:#c8b27b;

    font-size:10px;

    line-height:1.8;

    letter-spacing:1px;

}

/* =========================
   AGAIN BUTTON
========================= */

.again{

    margin-top:30px;

    padding:12px 25px;

    border-radius:30px;

    border:1px solid rgba(255,210,90,.35);

    background:transparent;

    color:#d9ba64;

    cursor:pointer;

    font-family:"Montserrat",sans-serif;

    font-size:11px;

    letter-spacing:1px;

    transition:.3s;

}

.again:hover{

    background:rgba(255,205,70,.08);

    border-color:#e9c451;

}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:35px 16px;
    }

    .form-box{
        padding:22px 18px;
    }

    .message-card{
        padding:35px 17px;
    }

    .message-text{
        font-size:13px;
        line-height:1.9;
    }

    .to{
        font-size:38px;
    }

    .from{
        font-size:40px;
    }

    .intro-bottom{
        letter-spacing:2px;
    }

}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
    }

}

</style>
</head>


<body>

<div id="particles"></div>


<main class="page">

<div class="container">


<!-- =========================
     INTRO
========================= -->

<section class="intro" id="intro">

    <div class="top-line"></div>

     FORM

                    Computer Science
                </option>

                    Physics
                </option>

                <option value="Chemistry">
                    Chemistry
                </option>

                <option value="English">
                    English
                </option>

                <option value="Hindi">
                    Hindi
                </option>

                <option value="Social Science">
                    Social Science
                </option>

                <option value="Biology">
                    Biology
                </option>

                <option value="General">
                    General / Other
                </option>

        </div>


        <button class="generate-btn" type="submit">

    </form>


    <!-- =========================

    <section class="message-section" id="messageSection">

            <div class="message-text" id="messageText">
            </div>


            <div class="signature-area">

                <div class="with">
                    With Respect & Gratitude
                </div>

                <div class="from">
                    Mankit
                </div>

                <div class="credentials">
                    SSC Japan Member<br>
                    Prerana Alum • MoE India
                </div>

            </div>


            <button class="again" id="againButton" type="button">
                Create Another Message
            </button>

        </div>

    </section>

</section>

</div>

</main>
