<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Wish</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Playfair Display', serif;
    overflow: hidden;
}

/* COMMON STYLE */
.screen {
    height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(135deg, #ffffff, #f3f3f3);
    position: absolute;
    top: 0;
    left: 0;
}

/* FIRST SCREEN */
#screen1 h1 {
    font-size: 32px;
    opacity: 0;
    animation: fadeIn 4s ease forwards;
}

/* SECOND SCREEN */
#screen2 {
    display: none;
    text-align: center;
}

#screen2 h1 {
    font-size: 40px;
    margin-bottom: 15px;
}

#screen2 p {
    font-size: 18px;
    color: #444;
    max-width: 80%;
}

/* PASSWORD BOX */
.password-box {
    position: absolute;
    bottom: 40px;
    background: #fff;
    padding: 15px 20px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    text-align: center;
}

.password-box input {
    padding: 10px;
    border: none;
    border-bottom: 2px solid #ccc;
    outline: none;
}

.password-box button {
    margin-top: 10px;
    padding: 8px 20px;
    border: none;
    background: black;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

/* ANIMATION */
@keyframes fadeIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
    <h1>Happy Birthday Madam President Tanishi Jii ✨</h1>

    <div class="password-box">
        <p>Enter Passkey To Continue</p>
        <input type="password" id="pass" placeholder="Enter Password">
        <br>
        <button onclick="checkPass()">Continue</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
    <h1>Happy Birthday Tanishi G 🎉</h1>
    <p>
        Aaj ka din sirf ek date nahi hai, balki ek aisi personality ka celebration hai  
        jo positivity, strength aur inspiration ka perfect example hai.  
        Always keep shining and making everyone proud ✨
    </p>
</div>

<script>
function checkPass() {
    let userPass = document.getElementById("pass").value;

    if(userPass === "MMTG231803") {
        document.getElementById("screen1").style.display = "none";
        document.getElementById("screen2").style.display = "flex";
    } else {
        alert("Wrong Password ❌");
    }
}
</script>

</body>
</html>
