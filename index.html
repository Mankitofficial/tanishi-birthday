<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Poppins',sans-serif;
}

/* SCREEN COMMON */
.screen {
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

/* FIRST SCREEN */
#screen1 {
    background: radial-gradient(circle,#1e5eff,#0b1f5e);
    color:#d4af37;
}

/* FADE TEXT */
.fade-text {
    font-family:'Playfair Display',serif;
    font-size:32px;
    opacity:0;
    animation:fadeIn 3s ease forwards;
}

@keyframes fadeIn {
    to { opacity:1; transform:translateY(0); }
}

/* PASSWORD BOX */
.pass-box {
    margin-top:40px;
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:15px;
    backdrop-filter:blur(10px);
}

.pass-box input {
    padding:10px;
    border:none;
    border-radius:8px;
    outline:none;
    text-align:center;
}

.pass-box button {
    margin-top:10px;
    padding:8px 20px;
    border:none;
    background:#d4af37;
    border-radius:8px;
    cursor:pointer;
}

/* SECOND SCREEN */
#screen2 {
    display:none;
    background: linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1513151233558-d860c5398176');
    background-size:cover;
    background-position:center;
    color:white;
}

/* TITLE */
.title {
    font-family:'Playfair Display',serif;
    font-size:34px;
}

/* COUNTDOWN */
.countdown {
    margin-top:20px;
    font-size:20px;
    background:rgba(0,0,0,0.4);
    padding:10px 20px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
    <div class="fade-text">
        Happy Birthday Tanishi Ji 🎉
    </div>

    <div class="pass-box">
        <p style="color:white;">Please Enter Password To Continue</p>
        <input type="password" id="pass" placeholder="Enter Password">
        <br>
        <button onclick="checkPass()">Continue</button>
    </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="screen2">
    <div class="title">Happy Birthday Tanishi Ji 🎂</div>

    <div class="countdown" id="countdown"></div>
</div>

<script>
/* PASSWORD */
function checkPass(){
    if(document.getElementById("pass").value==="MMTG231803"){
        document.getElementById("screen1").style.display="none";
        document.getElementById("screen2").style.display="flex";
    } else {
        alert("Wrong Password ❌");
    }
}

/* COUNTDOWN */
var targetDate = new Date("April 23, 2026 00:00:00").getTime();

setInterval(function(){
    var now = new Date().getTime();
    var gap = targetDate - now;

    var days = Math.floor(gap/(1000*60*60*24));
    var hours = Math.floor((gap%(1000*60*60*24))/(1000*60*60));
    var minutes = Math.floor((gap%(1000*60*60))/(1000*60));
    var seconds = Math.floor((gap%(1000*60))/1000);

    document.getElementById("countdown").innerHTML =
    days+"d "+hours+"h "+minutes+"m "+seconds+"s remaining 🎁";

},1000);
</script>

</body>
</html>
